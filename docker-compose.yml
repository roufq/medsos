version: '3'

services:
  goravel:
    build:
      context: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - uploads:/www/uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/v1/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: always

volumes:
  uploads:
